name: CI

on:
  push:
    branches: [dev, claude/push-dossier-audit-app-e69t0n]
  pull_request: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      # No real TURSO_DATABASE_URL/ANTHROPIC_API_KEY needed: lib/db.ts and
      # lib/anthropic.ts create their clients lazily on first call, not at
      # module load, so next build's static analysis/page-data collection
      # never touches them.
      - run: npm run build

      # §1.7: warn-only for now (piggybacked on this job rather than a
      # separate workflow) -- a high-severity advisory in a transitive dep
      # shouldn't block unrelated feature work until there's bandwidth to
      # triage promptly. Revisit making this blocking later.
      - name: Dependency audit (warn-only)
        run: npm audit --audit-level=high || true
